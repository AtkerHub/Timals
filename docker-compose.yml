services:
  db:
    container_name: timels-postgres-database
    image: postgres:18.6
    environment:
      - POSTGRES_DB=timels-postgres-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=timmy
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

volumes:
    postgres_data:
